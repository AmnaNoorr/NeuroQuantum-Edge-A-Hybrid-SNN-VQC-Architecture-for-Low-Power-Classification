experiment:
  name: hybrid_snn_vqc
  seed: 42
  device: cuda

data:
  csv_path: data/ecg.csv
  header: auto
  label_column: auto
  feature_count: 140
  split: [0.70, 0.15, 0.15]
  standardize_features: true

model:
  family: hybrid_snn_vqc
  input_features: 140
  snn_hidden_features: [128, 64]
  snn_timesteps: 25
  neuron: leaky
  beta: 0.90
  vqc:
    backend: default.qubit
    qubits: 4
    layers: 2
    output_classes: 2

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001

evaluation:
  metrics: [accuracy, precision, recall, f1, roc_auc]
