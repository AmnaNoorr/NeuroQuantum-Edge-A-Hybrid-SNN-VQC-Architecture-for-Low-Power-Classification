experiment:
  name: pure_snn
  seed: 42
  device: cuda

data:
  csv_path: data/ecg.csv
  header: auto
  label_column: auto
  feature_count: 140
  split: [0.70, 0.15, 0.15]
  standardize_features: true

model:
  family: snn
  input_features: 140
  hidden_features: [128, 64]
  output_classes: 2
  timesteps: 25
  neuron: leaky
  beta: 0.90
  encoding: rate
  delta_threshold: 0.10
  surrogate_slope: 25.0
  readout: spike_count

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001

evaluation:
  metrics: [accuracy, precision, recall, f1, roc_auc]
