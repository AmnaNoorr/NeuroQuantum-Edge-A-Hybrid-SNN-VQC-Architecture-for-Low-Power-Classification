experiment:
  name: pure_snn
  seed: 42
  device: cuda

data:
  csv_path: data/ecg.csv
  label_column: label
  feature_count: 140
  test_size: 0.20
  validation_size: 0.10
  stratify: true
  standardize_features: true

model:
  family: snn
  input_features: 140
  hidden_features: [128, 64]
  output_classes: 2
  timesteps: 25
  neuron: leaky
  beta: 0.90

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001

evaluation:
  metrics: [accuracy, precision, recall, f1, roc_auc]
